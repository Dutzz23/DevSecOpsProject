name: Remediated WordPress WPScan

on:
  workflow_dispatch:
  push:
    branches:
    - main
  
jobs:
  wordpress-wpscan:
    runs-on: ubuntu-latest
    environment: WPSCAN_API_TOKEN

    env:
      COMPOSE_PROJECT_NAME: wpbaseline
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
      MYSQL_ROOT_PASSWORD: password
      WORDPRESS_IMAGE: wordpress-hardened:ci

    steps:
      - name: Checkout (required even if no repo code is used)
        uses: actions/checkout@v4
      
      - name: Set up Docker environment
        run: |
          sudo systemctl start docker
          docker version
          docker compose version

      - name: Start WordPress stack
        run: |
          docker compose up -d --build --force-recreate

      - name: Wait for WordPress to be ready
        run: |
          echo "Waiting for WordPress to start..."
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/wp-admin/install.php >/dev/null; then
              echo "WordPress is ready!"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs db wordpress
          exit 1

      - name: Sync WordPress hardening plugin
        run: |
          docker exec --user root wp_app mkdir -p /var/www/html/wp-content/mu-plugins
          docker cp wordpress/wp-hardening.php wp_app:/var/www/html/wp-content/mu-plugins/wp-hardening.php
          docker exec --user root wp_app chown -R www-data:www-data /var/www/html/wp-content/mu-plugins

      - name: Verify hardening files
        run: |
          docker exec wp_app test -f /etc/apache2/conf-enabled/zz-security-hardening.conf
          docker exec wp_app test -f /usr/local/etc/php/conf.d/security-hardening.ini
          docker exec wp_app test -f /var/www/html/wp-content/mu-plugins/wp-hardening.php
          docker exec wp_app php -i | grep -q "expose_php => Off => Off"

      - name: Install WordPress test site
        run: |
          docker run --rm \
            --network "${COMPOSE_PROJECT_NAME}_wordpress_net" \
            --volumes-from wp_app \
            --user 33:33 \
            -e WORDPRESS_DB_HOST=wp_db:3306 \
            -e WORDPRESS_DB_USER="${WORDPRESS_DB_USER}" \
            -e WORDPRESS_DB_PASSWORD="${WORDPRESS_DB_PASSWORD}" \
            -e WORDPRESS_DB_NAME="${WORDPRESS_DB_NAME}" \
            wordpress:cli \
            wp core install \
              --url=http://localhost:8080 \
              --title="DevSecOps Remediated Scan" \
              --admin_user=dutzz23 \
              --admin_password="Password123!" \
              --admin_email=admin@example.com \
              --skip-email

      - name: Install Ruby and WPScan
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential libcurl4-openssl-dev zlib1g-dev
          sudo gem install wpscan

      - name: Run WPScan
        env:
          WPSCAN_API_TOKEN: ${{ secrets.WPSCAN_API_TOKEN }}
        run: |
          mkdir -p scans/remediated

          WPSCAN_ARGS=(
            --url http://localhost:8080
            --enumerate u,ap,at
            --plugins-detection aggressive
            --force
          )

          set +e

          if [ -n "$WPSCAN_API_TOKEN" ]; then
            echo "Running WPScan with API token."
            wpscan "${WPSCAN_ARGS[@]}" --api-token "$WPSCAN_API_TOKEN" 2>&1 | tee scans/remediated/wpscan-remediated.txt
            WPSCAN_EXIT=${PIPESTATUS[0]}

            if [ "$WPSCAN_EXIT" -ne 0 ] && grep -Eq "status: 401|Unauthorized" scans/remediated/wpscan-remediated.txt; then
              echo "" | tee -a scans/remediated/wpscan-remediated.txt
              echo "WPScan API token was rejected. Retrying without token so the remediated scan still runs." | tee -a scans/remediated/wpscan-remediated.txt
              wpscan "${WPSCAN_ARGS[@]}" 2>&1 | tee -a scans/remediated/wpscan-remediated.txt
              WPSCAN_EXIT=${PIPESTATUS[0]}
            fi
          else
            echo "WPSCAN_API_TOKEN is not available to this workflow."
            wpscan "${WPSCAN_ARGS[@]}" 2>&1 | tee scans/remediated/wpscan-remediated.txt
            WPSCAN_EXIT=${PIPESTATUS[0]}
          fi

          echo "WPScan exit code: ${WPSCAN_EXIT}" | tee -a scans/remediated/wpscan-remediated.txt
          test -s scans/remediated/wpscan-remediated.txt || echo "WPScan produced no output." > scans/remediated/wpscan-remediated.txt
          exit 0

      - name: Upload WPScan results
        uses: actions/upload-artifact@v4
        with:
          name: wpscan-remediated-results
          path: scans/remediated/
          if-no-files-found: warn

      - name: Shutdown WordPress stack
        if: always()
        run: |
          docker compose down -v --remove-orphans
